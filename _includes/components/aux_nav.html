<nav aria-label="Auxiliary" class="aux-nav">
  <ul class="aux-nav-list">
    {% for link in site.aux_links %}
      <li class="aux-nav-list-item">
        <a href="{{ link.last }}" class="site-button"
          {% if site.aux_links_new_tab %}
          target="_blank" rel="noopener noreferrer"
          {% endif %}
        >
          {{ link.first }}
        </a>
      </li>
    {% endfor %}
    <li class="aux-nav-list-item">
      <button type="button" id="theme-toggle" class="site-button btn-reset" aria-label="Theme: system" title="Theme: system (click to cycle system, dark, light)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
      </button>
    </li>
  </ul>
</nav>

<script>
  (function () {
    var toggle = document.getElementById('theme-toggle');
    var icon = toggle.querySelector('svg');

    var icons = {
      system: '<rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line>',
      dark: '<path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"></path>',
      light: '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'
    };
    var modes = ['system', 'dark', 'light'];

    function storedMode() {
      try {
        var mode = localStorage.getItem('theme');
        if (modes.indexOf(mode) !== -1) {
          return mode;
        }
      } catch (e) {}
      return null;
    }

    function currentMode() {
      return storedMode() || 'system';
    }

    function osPrefersDark() {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function resolveTheme(mode) {
      if (mode === 'dark' || mode === 'light') {
        return mode;
      }
      return osPrefersDark();
    }

    function setMode(mode) {
      jtd.setTheme(resolveTheme(mode));
      icon.innerHTML = icons[mode];
      toggle.setAttribute('aria-label', 'Theme: ' + mode);
      toggle.setAttribute('title', 'Theme: ' + mode + ' (click to cycle system, dark, light)');
    }

    setMode(currentMode());

    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    function onSystemChange() {
      if (currentMode() === 'system') {
        setMode('system');
      }
    }
    if (mq) {
      mq.addEventListener ? mq.addEventListener('change', onSystemChange) : mq.addListener(onSystemChange);
    }

    jtd.addEvent(toggle, 'click', function () {
      var idx = modes.indexOf(currentMode());
      var next = modes[(idx + 1) % modes.length];
      setMode(next);
      try {
        localStorage.setItem('theme', next);
      } catch (e) {}
    });
  })();
</script>
