<button type="button" id="theme-toggle" class="site-button btn-reset" aria-label="Toggle theme">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
</button>

<script>
  (function () {
    var toggle = document.getElementById('theme-toggle');
    var icon = toggle.querySelector('svg');

    var sun = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
    var moon = '<path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"></path>';

    function storedTheme() {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') {
          return theme;
        }
      } catch (e) {}
      return null;
    }

    function themePreference() {
      var theme = storedTheme();
      if (!theme) {
        theme = 'dark';
      }
      return theme;
    }

    function setIcon(theme) {
      icon.innerHTML = theme === 'dark' ? sun : moon;
    }

    function setTheme(theme) {
      jtd.setTheme(theme);
      setIcon(theme);
    }

    setIcon(themePreference());

    jtd.addEvent(toggle, 'click', function () {
      var current = jtd.getTheme();
      var next = current === 'dark' ? 'light' : 'dark';
      setTheme(next);
      try {
        localStorage.setItem('theme', next);
      } catch (e) {}
    });
  })();
</script>
